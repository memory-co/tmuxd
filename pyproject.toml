[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tmuxd"
dynamic = ["version"]        # 单一来源:tmuxd/__init__.py
description = "tmux + ttyd as a Python library: terminals that outlive the connection, that a program can type into and a person can open in a browser"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Twwy", email = "twwwwwy@gmail.com" }]
keywords = ["tmux", "ttyd", "terminal", "session", "pty", "agent", "web terminal"]
dependencies = []

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Shells",
    "Topic :: System :: Systems Administration",
    "Topic :: Terminals :: Terminal Emulators/X Terminals",
]

[project.urls]
Homepage = "https://github.com/memory-co/tmuxd"
Repository = "https://github.com/memory-co/tmuxd"
Documentation = "https://github.com/memory-co/tmuxd/tree/main/docs/v1/works"
Issues = "https://github.com/memory-co/tmuxd/issues"

[project.scripts]
tmuxd = "tmuxd.cli:main"

[project.optional-dependencies]
# The CLI and the server are one thing: a CLI command is too short-lived to
# hold ttyd or session state, so it talks to `tmuxd serve` over the control
# port. Embedding the library needs none of this, which is why it is an extra.
server = ["fastapi>=0.110", "uvicorn>=0.27"]
# httpx is not ours -- starlette's TestClient imports it, and without it
# every control_api test fails on a clean machine. It was invisible here
# because a laptop usually already has it; CI is the machine that does not.
dev = ["pytest>=7", "fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]

[tool.setuptools]
packages = ["tmuxd"]

[tool.setuptools.dynamic]
version = { attr = "tmuxd.__version__" }

[tool.setuptools.package-data]
tmuxd = ["data/*", "data/ttyd/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "test.py"]   # 场景住在 <名字>/test.py
