[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tmuxd"
version = "1.0.0"
description = "tmux + ttyd as a Python library: terminals that outlive the connection, that a program can type into and a person can open in a browser"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Twwy", email = "twwwwwy@gmail.com" }]
keywords = ["tmux", "ttyd", "terminal", "session", "pty", "agent", "web terminal"]
dependencies = []

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Shells",
    "Topic :: System :: Systems Administration",
    "Topic :: Terminals :: Terminal Emulators/X Terminals",
]

[project.urls]
Homepage = "https://github.com/memory-co/tmuxd"
Repository = "https://github.com/memory-co/tmuxd"
Documentation = "https://github.com/memory-co/tmuxd/tree/main/docs/v1/works"
Issues = "https://github.com/memory-co/tmuxd/issues"

[project.scripts]
tmuxd = "tmuxd.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["tmuxd"]

[tool.setuptools.package-data]
tmuxd = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
