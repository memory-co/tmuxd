# tmuxd's tmux config. Three settings that have to be set, and nothing that
# touches how you like your own tmux -- this file is passed with -f, so your
# ~/.tmux.conf is not read for this pool at all.

# How far back a person can scroll in the browser.
set -g history-limit @HISTORY_LIMIT@

# With several clients on one session, follow the last one to act instead of
# clamping everyone to the smallest window.
set -g window-size latest

# One session is one terminal, so there is never more than one window tab to
# show. The status bar would be pure noise.
set -g status off

# No keys are unbound. Splitting with C-b % is you using tmux, and there is no
# reason to stop you -- tmuxd simply offers no API for panes and always acts on
# the active one.
