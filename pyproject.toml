[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tmuxd"
version = "1.0.0"
description = "A Python library that wires tmux and ttyd into terminals that outlive the connection and can be typed into by programs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
tmuxd = "tmuxd.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["tmuxd"]

[tool.setuptools.package-data]
tmuxd = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
